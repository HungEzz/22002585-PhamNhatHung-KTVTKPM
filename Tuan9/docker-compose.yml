version: '3.8'
services:
  orchestrator:
    build: ./orchestrator
    container_name: travelsoa-orchestrator
    ports:
      - "8080:8080"
    environment:
      - USER_SERVICE_URL=http://user-service:8081
      - TOUR_SERVICE_URL=http://tour-service:8082
      - BOOKING_SERVICE_URL=http://booking-service:8083
      - PAYMENT_SERVICE_URL=http://payment-service:8084
    networks:
      - soa-net

  frontend:
    build: ./frontend
    container_name: travelsoa-frontend
    ports:
      - "3000:80"
    depends_on:
      - orchestrator
    networks:
      - soa-net

networks:
  soa-net:
    driver: bridge
